<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Note Manager</h1>
    <form id="note-form">
      <input type="text" id="name" class="input-note" placeholder="Note Title" required />
      <textarea id="description" class="input-note" placeholder="Note Description" required></textarea>
      <button class="submit-btn" type="submit">Add Note</button>
    </form>

    <div id="notes-container"></div>
    <script src="script.js"></script>
  </body>
</html>
